<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Users - eReader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<script>try{var s=JSON.parse(localStorage.getItem('ereader.settings')||'{}');var t=(s.v||s.theme!=='light')&&s.theme||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var d=document.documentElement;d.dataset.theme=t;var k=s.skin&&s.skin!=='auto'?s.skin:(s.eink||/boox|onyx|kobo|kindle|tolino|pocketbook|remarkable|bigme|hisense|meebook|e-?ink/i.test(navigator.userAgent+' '+(s.device||''))?'eink':'soft');d.dataset.skin=k;if(k==='eink'&&s.eink)d.dataset.eink='1';}catch(e){document.documentElement.dataset.skin=document.documentElement.dataset.skin||'soft'}</script>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/soft.css">
</head>
<body>
<header class="app-header">
  <a class="brand" href="/">eReader</a>
  <span class="spacer"></span>
  <nav><a class="btn small" href="/">Library</a></nav>
</header>
<main class="page narrow">
  <h1>Users</h1>
  <p class="muted">Every user can read every book. Reading positions and bookmarks are kept per user.</p>
  <div id="list"></div>
  <h2>Add a user</h2>
  <form id="add-form">
    <div class="field"><label for="u">Username</label><input id="u" autocapitalize="none" autocorrect="off" required></div>
    <div class="field"><label for="d">Display name</label><input id="d"></div>
    <div class="field"><label for="p">Password</label><input id="p" type="text" autocomplete="off" required></div>
    <div class="field"><label class="row" style="font-weight:600"><input type="checkbox" id="a" style="width:22px;height:22px"> Administrator</label></div>
    <p class="error hidden" id="error"></p>
    <button class="btn primary" type="submit">Add user</button>
  </form>
</main>
<div id="dialog-root"></div>
<script type="module" src="/js/users.js"></script>
</body>
</html>
