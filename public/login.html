<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in - eReader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>try{var s=JSON.parse(localStorage.getItem('ereader.settings')||'{}');var t=(s.v||s.theme!=='light')&&s.theme||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;if(s.eink)document.documentElement.dataset.eink='1';}catch(e){}</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="app-header"><a class="brand" href="/">eReader</a></header>
<main class="page narrow">
  <h1 id="heading">Sign in</h1>
  <p class="notice hidden" id="setup-note">Welcome! No accounts exist yet. Create the first account - it will be the administrator who can add other readers.</p>
  <form id="form" autocomplete="on">
    <div class="field"><label for="username">Username</label><input id="username" name="username" autocapitalize="none" autocorrect="off" required autofocus></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required></div>
    <div class="field hidden" id="display-field"><label for="displayName">Display name (optional)</label><input id="displayName" name="displayName"></div>
    <div class="field"><label for="device">This device's name</label><input id="device" name="device" placeholder="e.g. Boox, iPhone, Laptop"><span class="muted" style="font-size:13px">Shown when syncing your reading position between devices.</span></div>
    <p class="error hidden" id="error"></p>
    <div class="row">
      <button class="btn primary" type="submit" id="submit">Sign in</button>
      <button class="btn hidden" type="button" id="toggle-register">Create account</button>
    </div>
  </form>
</main>
<script type="module" src="/js/login.js"></script>
</body>
</html>
