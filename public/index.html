<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eReader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="eReader">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>try{var s=JSON.parse(localStorage.getItem('ereader.settings')||'{}');var t=(s.v||s.theme!=='light')&&s.theme||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var d=document.documentElement;d.dataset.theme=t;var k=s.skin&&s.skin!=='auto'?s.skin:(s.eink||/boox|onyx|kobo|kindle|tolino|pocketbook|remarkable|bigme|hisense|meebook|e-?ink/i.test(navigator.userAgent+' '+(s.device||''))?'eink':'soft');d.dataset.skin=k;if(k==='eink'&&s.eink)d.dataset.eink='1';}catch(e){document.documentElement.dataset.skin=document.documentElement.dataset.skin||'soft'}</script>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/soft.css">
</head>
<body class="library">
<header class="app-header">
  <button type="button" class="btn icon menu-toggle" id="btn-menu" aria-expanded="false" aria-controls="library-controls" aria-label="Menu">&#9776;</button>
  <a class="brand" href="/">eReader</a>
  <span class="section-name" id="section-name">Books</span>
  <span class="spacer"></span>
  <nav>
    <a class="btn small hidden" id="nav-users" href="/users">Users</a>
    <a class="btn small" href="/settings">Settings</a>
    <button class="btn small" id="btn-logout">Sign out</button>
  </nav>
</header>
<main class="page">
  <div id="library-controls">
    <div class="tabs" id="tabs">
      <button type="button" data-view="books" aria-pressed="true">Books<span class="n"></span></button>
      <button type="button" data-view="series" aria-pressed="false">Series &amp; collections<span class="n"></span></button>
    </div>
    <div class="toolbar">
      <label class="control search"><span>Search</span><input type="search" id="search" placeholder="Title, author, series or genre" autocomplete="off"></label>
      <label class="control"><span>Filter</span><select id="filter">
        <option value="all">All books</option>
        <option value="reading">Reading</option>
        <option value="unread">Not started</option>
        <option value="finished">Finished</option>
        <option value="duplicates">Duplicates</option>
      </select></label>
      <label class="control"><span>Sort by</span><select id="sort">
        <option value="recent">Recently read</option>
        <option value="added">Recently added</option>
        <option value="title">Title</option>
        <option value="author">Author</option>
      </select></label>
      <label class="control"><span>Group by</span><select id="group">
        <option value="none">No grouping</option>
        <option value="author">Author</option>
        <option value="genre">Genre</option>
      </select></label>
      <label class="control"><span>Library view</span><select id="layout">
        <option value="stacks">Series as stacks</option>
        <option value="shelves">Series as shelves</option>
        <option value="every">Every book separately</option>
      </select></label>
      <label class="control"><span>Book view</span><select id="display">
        <option value="list">List</option>
        <option value="cards-2">Large cards</option>
        <option value="cards-3">Cards</option>
        <option value="cards-4">Small cards</option>
      </select></label>
      <button type="button" class="btn" id="btn-select" aria-pressed="false">Select</button>
      <button class="btn primary" id="btn-upload">Upload books</button>
      <input type="file" id="file-input" class="hidden" multiple accept=".epub,.mobi,.prc,.azw,.azw3,.pdf,.md,.markdown,.txt,.text,application/epub+zip,application/pdf,text/plain,text/markdown">
      <input type="file" id="folder-input" class="hidden" webkitdirectory>
    </div>
    <div class="dropzone" id="dropzone">Drop EPUB, MOBI, PDF, Markdown or text files, or folders of them, here to add them to the library <button type="button" class="btn small hidden" id="btn-upload-folder">Upload a folder</button></div>
  </div>
  <div class="uploads" id="uploads"></div>
  <div class="active-filters hidden" id="active-filters"></div>
  <p class="notice hidden" id="offline-note">No connection. The books kept on this device can be read; the faded ones need a connection.</p>
  <div id="library"></div>
</main>
<div class="select-bar hidden" id="select-bar" role="region" aria-label="Selected books">
  <span class="count" data-count aria-live="polite"></span>
  <button type="button" class="btn small" data-sel="all">Select all</button>
  <button type="button" class="btn small" data-sel="clear">Clear</button>
  <button type="button" class="btn small primary" data-sel="genre">Set genre</button>
  <button type="button" class="btn small" data-sel="done">Done</button>
</div>
<div id="dialog-root"></div>
<script type="module" src="/js/library.js"></script>
</body>
</html>
