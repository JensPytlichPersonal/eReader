services:
  rreader:
    build: .
    image: rreader:latest
    container_name: rreader
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Set to "true" when the server is reached only over https (cookies are then marked Secure).
      SECURE_COOKIES: "false"
      # Set to "true" if you run rReader behind a reverse proxy that sets X-Forwarded-* headers.
      TRUST_PROXY: "false"
      # Allow anyone to create an account. The first account is always allowed (it becomes admin).
      ALLOW_REGISTRATION: "false"
      # Maximum upload size in megabytes.
      MAX_UPLOAD_MB: "500"
      # How many days a sign-in lasts on a device.
      SESSION_DAYS: "365"
    volumes:
      - ./data:/data
